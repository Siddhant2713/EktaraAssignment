[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 40
addopts = -ra
markers =
    live: calls the real Gemini API and the open web (run with --live)
    slow: takes more than about 10 seconds
filterwarnings =
    ignore::DeprecationWarning
